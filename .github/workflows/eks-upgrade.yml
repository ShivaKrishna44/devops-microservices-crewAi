name: EKS Upgrade (Agent + Human Approval)

# Human-in-the-loop EKS upgrade.
#   Job 1 (precheck-plan): agents run READ-ONLY pre-checks + terraform plan. Always safe.
#   Job 2 (apply): terraform apply — GATED behind a GitHub Environment that
#                  requires a human reviewer to approve before it runs.
#
# The target version is provided by a human via workflow_dispatch input.
# Nothing is applied until (a) pre-checks pass AND (b) a human approves the
# "production-eks-upgrade" environment.

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target Kubernetes version (single minor step, e.g. 1.34)'
        required: true
        type: string

permissions:
  id-token: write   # OIDC for AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  CREWAI_LLM: ${{ vars.CREWAI_LLM }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  # Terraform dir lives in this repo (or set to a checked-out path)
  TERRAFORM_DIR: ${{ github.workspace }}/Terraform

jobs:
  # ─── Job 1: READ-ONLY pre-checks + plan (no changes) ──────────────────
  precheck-plan:
    name: Pre-checks & Plan (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent deps
        working-directory: app
        run: pip install -r requirements.txt

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Run pre-checks + plan (read-only, no apply)
        working-directory: app
        run: |
          # --status is safe; the real precheck runs via a dry entrypoint that
          # stops BEFORE the approval prompt. In CI we run precheck+plan only.
          python - <<'PY'
          from crew import run_precheck
          import os, sys
          target = os.environ["TARGET_VERSION"]
          print(run_precheck(target))
          PY
        env:
          TARGET_VERSION: ${{ github.event.inputs.target_version }}

  # ─── Job 2: APPLY — requires manual approval via Environment ──────────
  apply:
    name: Apply Upgrade (requires human approval)
    runs-on: ubuntu-latest
    needs: precheck-plan
    # This is the gate: configure required reviewers on this environment in
    # Settings → Environments → production-eks-upgrade. The job pauses here
    # until a human approves.
    environment:
      name: production-eks-upgrade
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent deps
        working-directory: app
        run: pip install -r requirements.txt

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply upgrade (environment approval already granted)
        working-directory: app
        run: |
          # Reaching this step means a human approved the environment.
          # --yes records the approval in the gate (the human approval happened
          # at the GitHub Environment gate) and runs apply + validate.
          python main.py --target-version "$TARGET_VERSION" --actor "${{ github.actor }}" --yes
        env:
          TARGET_VERSION: ${{ github.event.inputs.target_version }}
